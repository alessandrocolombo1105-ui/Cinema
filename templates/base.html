{% load static %}
<!doctype html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ITS Cinema{% endblock %}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <script src="{% static 'js/main.js' %}"></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <a class="visually-hidden-focusable skip-link" href="#contenuto">Salta al contenuto</a>

  <nav class="navbar navbar-expand-md sticky-top site-nav" data-site-nav>
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{% url 'cinema:home' %}">
        <span class="brand-mark"><i class="bi bi-film"></i></span>
        <span>ITS <span class="text-accent">Cinema</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Apri il menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-md-center">
          <li class="nav-item">
            <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}"
               href="{% url 'cinema:home' %}">Programmazione</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="contenuto" class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer mt-auto">
    <div class="container py-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small text-body-secondary">
      <span class="d-flex align-items-center gap-2">
        <span class="brand-mark brand-mark-sm"><i class="bi bi-film"></i></span>
        &copy; {% now "Y" %} ITS Cinema
      </span>
      <span>Dati forniti dall'API its-cinema</span>
    </div>
  </footer>

  <button type="button" class="back-to-top" data-back-to-top aria-label="Torna all'inizio della pagina">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
